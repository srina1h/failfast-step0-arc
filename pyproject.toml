[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "failfast-step0-arc"
version = "0.1.0"
description = "Adapted value-only FailFast monitor experiment for coding-agent trajectories"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate==1.10.1",
  "huggingface-hub==0.34.4",
  "numpy==2.2.6",
  "pandas==2.3.2",
  "peft==0.17.1",
  "pyarrow==20.0.0",
  "scikit-learn==1.7.1",
  "torch==2.7.1",
  "transformers==4.55.4",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
